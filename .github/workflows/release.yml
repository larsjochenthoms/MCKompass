name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Complete a publication before starting another one. Cancelling an upload
# could leave a draft containing only some of the update files.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  installers:
    name: Installer fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Test the native installer with temporary Minecraft fixtures
        run: python -m unittest discover -s scripts/tests -p test_installers.py -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate its wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build and test the mod
        run: ./gradlew build --no-daemon

      - name: Check version and prepare release files
        run: >-
          python3 scripts/prepare_release.py
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --output-dir dist

      - name: Keep test reports, including on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pass tested files to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # This job intentionally does not check out or execute project code.
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: dist

      - name: Verify file checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create or resume a draft, then upload all files
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != true ]; then
              echo '::error::This version is already published. Create a new version and tag instead of replacing a published update.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft --verify-tag --generate-notes \
              --title "Kompass-Abenteuer $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish the complete release and update the latest download
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
